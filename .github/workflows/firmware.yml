name: Firmware

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_PATH: ${{ github.workspace }}/.ci-dependencies/pico-sdk
  PICO_EXTRAS_PATH: ${{ github.workspace }}/.ci-dependencies/pico-extras
  PICOTOOL_FETCH_FROM_GIT_PATH: ${{ github.workspace }}/.ci-dependencies/picotool
  PICO_CACHE_REVISION: "2"

jobs:
  build:
    name: Build Pico 2 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore Pico SDK and pico-extras
        id: pico-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PICO_SDK_PATH }}
            ${{ env.PICO_EXTRAS_PATH }}
            ${{ env.PICOTOOL_FETCH_FROM_GIT_PATH }}
          key: pico-${{ runner.os }}-${{ runner.arch }}-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_CACHE_REVISION }}

      - name: Download Pico dependencies
        if: steps.pico-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.ci-dependencies"
          git clone --branch "$PICO_SDK_VERSION" --depth 1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git clone --branch "sdk-$PICO_SDK_VERSION" --depth 1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-extras.git "$PICO_EXTRAS_PATH"

      - name: Install Arm compiler
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2

      - name: Compile
        shell: bash
        run: cmake --build build --parallel

      - name: Package tested default-branch firmware
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          project_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          mkdir -p dist
          install -m 0644 build/src/p2000m-vid2vga-firmware.uf2 \
            "dist/p2000m-vid2vga-firmware-v${project_version}.uf2"
          install -m 0644 LICENSE.md THIRD_PARTY_NOTICES.md dist/
          install -m 0644 LICENSES/GPL-3.0-or-later.txt \
            dist/LICENSE-GPL-3.0-or-later.txt
          install -m 0644 LICENSES/LGPL-3.0-only.txt \
            dist/LICENSE-LGPL-3.0-only.txt
          install -m 0644 LICENSES/CERN-OHL-S-2.0.txt \
            dist/LICENSE-CERN-OHL-S-2.0.txt
          install -m 0644 LICENSES/CC-BY-4.0.txt \
            dist/LICENSE-CC-BY-4.0.txt
          install -m 0644 LICENSES/BSD-3-Clause.txt \
            dist/LICENSE-BSD-3-Clause.txt
          install -m 0644 LICENSES/MIT.txt dist/LICENSE-MIT.txt
          test -s "dist/p2000m-vid2vga-firmware-v${project_version}.uf2"

      - name: Preserve tested default-branch firmware
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
